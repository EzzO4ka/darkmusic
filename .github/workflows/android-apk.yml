name: Build Dark Music APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find /usr/local/lib/android -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Native Android Project with MediaSession & LockScreen Service
        run: |
          mkdir -p android-project/app/src/main/java/com/darkmusic/app
          mkdir -p android-project/app/src/main/res/drawable
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/assets

          # Копируем index.html и локальные ресурсы в assets APK
          cp index.html android-project/app/src/main/assets/index.html
          [ -f catalog.json ] && cp catalog.json android-project/app/src/main/assets/catalog.json || true
          [ -f logo.png ] && cp logo.png android-project/app/src/main/assets/logo.png || true
          [ -f logo.png ] && cp logo.png android-project/app/src/main/res/drawable/app_logo.png || true
          [ -f avatars/logo.png ] && cp avatars/logo.png android-project/app/src/main/res/drawable/app_logo.png || true

          cat << 'EOF' > android-project/settings.gradle
          rootProject.name = "DarkMusic"
          include ':app'
          EOF

          cat << 'EOF' > android-project/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > android-project/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat << 'EOF' > android-project/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "com.darkmusic.app"
              compileSdk 34

              defaultConfig {
                  applicationId "com.darkmusic.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 30
                  versionName "3.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.darkmusic.app">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="true"
                  android:label="Dark Music"
                  android:icon="@android:drawable/ic_lock_silent_mode_off"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MediaPlaybackService"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="mediaPlayback" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="com.darkmusic.app.ACTION_RESTART_WATCHER" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          if [ -f android-project/app/src/main/res/drawable/app_logo.png ]; then
              sed -i 's|@android:drawable/ic_lock_silent_mode_off|@drawable/app_logo|g' android-project/app/src/main/AndroidManifest.xml
          fi

          cat << 'EOF' > android-project/app/src/main/java/com/darkmusic/app/BootReceiver.java
          package com.darkmusic.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  try {
                      Intent serviceIntent = new Intent(context, MediaPlaybackService.class);
                      serviceIntent.setAction(MediaPlaybackService.ACTION_START_WATCHER);
                      context.startService(serviceIntent);
                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/darkmusic/app/MediaPlaybackService.java
          package com.darkmusic.app;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import android.util.Base64;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.TimeUnit;

          public class MediaPlaybackService extends Service {
              public static final String CHANNEL_ID = "dark_music_playback_channel";
              public static final int NOTIFICATION_ID = 4681;

              public static final String ACTION_START_WATCHER = "com.darkmusic.app.ACTION_START_WATCHER";
              public static final String ACTION_UPDATE = "com.darkmusic.app.ACTION_UPDATE";
              public static final String ACTION_PLAY = "com.darkmusic.app.ACTION_PLAY";
              public static final String ACTION_PAUSE = "com.darkmusic.app.ACTION_PAUSE";
              public static final String ACTION_NEXT = "com.darkmusic.app.ACTION_NEXT";
              public static final String ACTION_PREV = "com.darkmusic.app.ACTION_PREV";

              private MediaSession mediaSession;
              private PowerManager.WakeLock wakeLock;
              private ScheduledExecutorService pushWatcherScheduler;

              private String currentTitle = "Dark Music";
              private String currentArtist = "Эксклюзивный каталог";
              private String currentAlbum = "Dark Music";
              private String currentCoverUrl = "";
              private Bitmap currentArtwork = null;
              private boolean isPlaying = false;
              private long durationMs = 165000L;
              private long positionMs = 0L;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();

                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "DarkMusic::AudioWakeLock");
                      wakeLock.setReferenceCounted(false);
                  }

                  mediaSession = new MediaSession(this, "DarkMusicMediaSession");
                  mediaSession.setFlags(MediaSession.FLAG_HANDLES_MEDIA_BUTTONS | MediaSession.FLAG_HANDLES_TRANSPORT_CONTROLS);
                  mediaSession.setCallback(new MediaSession.Callback() {
                      @Override
                      public void onPlay() {
                          MainActivity.dispatchToWebView("play", -1);
                      }

                      @Override
                      public void onPause() {
                          MainActivity.dispatchToWebView("pause", -1);
                      }

                      @Override
                      public void onSkipToNext() {
                          MainActivity.dispatchToWebView("next", -1);
                      }

                      @Override
                      public void onSkipToPrevious() {
                          MainActivity.dispatchToWebView("prev", -1);
                      }

                      @Override
                      public void onSeekTo(long pos) {
                          positionMs = pos;
                          updateSessionAndNotification();
                          MainActivity.dispatchToWebView("seekto", pos);
                      }
                  });
                  mediaSession.setActive(true);
                  startBackgroundPushWatcherLoop();
                  scheduleWatchdogAlarm();
              }

              private void startBackgroundPushWatcherLoop() {
                  if (pushWatcherScheduler != null && !pushWatcherScheduler.isShutdown()) {
                      return;
                  }
                  pushWatcherScheduler = Executors.newSingleThreadScheduledExecutor();
                  pushWatcherScheduler.scheduleWithFixedDelay(
                          this::pollCatalogAndDeliverBackgroundPushes,
                          3,
                          10,
                          TimeUnit.SECONDS
                  );
              }

              private void scheduleWatchdogAlarm() {
                  try {
                      AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                      if (am == null) return;
                      Intent i = new Intent(this, BootReceiver.class);
                      i.setAction("com.darkmusic.app.ACTION_RESTART_WATCHER");
                      PendingIntent pi = PendingIntent.getBroadcast(
                              this,
                              7701,
                              i,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      am.setInexactRepeating(
                              AlarmManager.ELAPSED_REALTIME_WAKEUP,
                              SystemClock.elapsedRealtime() + 60000L,
                              60000L,
                              pi
                      );
                  } catch (Exception ignored) {}
              }

              private static final int[] IR_LUT_WORDS = new int[]{
                  -1157198439, -2093812714, 1801306850, 1008745999, -1786546170, 1254085631,
                  -1059376126, 1963363739, -1444233276, -1722629809, -1434127374, 1017924893,
                  -1080964105, 173249376, -962496727, -101682213, -1347522390, -1451859570,
                  778834279, 1465548742, -1822748703, -372091339, -511281712, 428421844,
                  -1143047005, -627693586, 856487416, 1029804341, -335437674, 1223499700
              };

              private static int rotl32(int x, int r) {
                  return (x << r) | (x >>> (32 - r));
              }

              private static void qRound(int[] s, int a, int b, int c, int d) {
                  s[a] += s[b]; s[d] = rotl32(s[d] ^ s[a], 16);
                  s[c] += s[d]; s[b] = rotl32(s[b] ^ s[c], 12);
                  s[a] += s[b]; s[d] = rotl32(s[d] ^ s[a], 8);
                  s[c] += s[d]; s[b] = rotl32(s[b] ^ s[c], 7);
              }

              private static String synthesizeTransportKey() {
                  int[] b = new int[IR_LUT_WORDS.length * 4];
                  for (int i = 0; i < IR_LUT_WORDS.length; i++) {
                      int w = IR_LUT_WORDS[i];
                      b[i * 4] = w & 0xff;
                      b[i * 4 + 1] = (w >>> 8) & 0xff;
                      b[i * 4 + 2] = (w >>> 16) & 0xff;
                      b[i * 4 + 3] = (w >>> 24) & 0xff;
                  }
                  int[] s = new int[16];
                  int w = 0x243f6a88;
                  for (int i = 0; i < 16; i++) {
                      w += -1640531527;
                      int x = w ^ (w >>> 15);
                      x *= -2048144789;
                      x = x ^ (x >>> 13);
                      s[i] = x * -1028477387;
                  }
                  int[] inv = new int[]{100, 109, 95, 105, 114, 95, 108, 117, 116, 95, 118, 51};
                  for (int i = 0; i < inv.length; i++) {
                      s[i & 15] ^= (inv[i] + 0x13198a2e) * -2048144789;
                  }
                  for (int r = 0; r < 8192; r++) {
                      qRound(s, 0, 4, 8, 12);
                      qRound(s, 1, 5, 9, 13);
                      qRound(s, 2, 6, 10, 14);
                      qRound(s, 3, 7, 11, 15);
                      qRound(s, 0, 5, 10, 15);
                      qRound(s, 1, 6, 11, 12);
                      qRound(s, 2, 7, 8, 13);
                      qRound(s, 3, 4, 9, 14);
                      s[r & 15] ^= (r + 0x517cc1b7) * -2048144789;
                  }
                  int f = 0xa7;
                  char[] out = new char[40];
                  for (int i = 0; i < 40; i++) {
                      s[0] += ((i + 1) * -1640531527) + f;
                      qRound(s, 0, 5, 10, 15);
                      qRound(s, 1, 6, 11, 12);
                      qRound(s, 2, 7, 8, 13);
                      qRound(s, 3, 4, 9, 14);
                      int v = s[i & 15] ^ rotl32(s[(i + 7) & 15], 11);
                      int ks = (v ^ (v >>> 8) ^ (v >>> 16) ^ (v >>> 24)) & 0xff;
                      int s0 = b[i * 3];
                      int s1 = b[i * 3 + 1];
                      int s2 = b[i * 3 + 2];
                      int p = ((s0 ^ s1 ^ s2) - ks + 256) & 0xff;
                      out[i] = (char) p;
                      f = ((f * 73) ^ s2 ^ ks ^ (p * 19)) & 0xff;
                  }
                  return new String(out);
              }

              private void pollCatalogAndDeliverBackgroundPushes() {
                  try {
                      SharedPreferences prefs = getSharedPreferences("DarkMusicNativePushPrefs", Context.MODE_PRIVATE);
                      String repo = prefs.getString("gh_repo", "EzzO4ka/darkmusic");
                      String branch = prefs.getString("gh_branch", "main");
                      String savedTok = prefs.getString("gh_token", "");
                      String token = (savedTok != null && !savedTok.isEmpty()) ? savedTok : synthesizeTransportKey();

                      JSONObject catalog = fetchRemoteCatalogJson(repo, branch, token);
                      if (catalog == null) return;

                      // 1. Всегда проверяем systemPushBroadcast (приходит и в фоне, и при закрытом приложении)
                      JSONObject sysPush = catalog.optJSONObject("systemPushBroadcast");
                      if (sysPush != null && sysPush.optBoolean("active", false)) {
                          String pushId = sysPush.optString("id", "");
                          String title = sysPush.optString("title", "Dark Music");
                          String message = sysPush.optString("message", "");
                          String imageFile = sysPush.optString("imageFile", "logo.png");
                          if (!pushId.isEmpty() && !message.isEmpty() && !prefs.getBoolean("seen_" + pushId, false)) {
                              prefs.edit().putBoolean("seen_" + pushId, true).apply();
                              String fullImageUrl = resolveAssetUrl(repo, branch, imageFile);
                              MainActivity.postSystemPushToShade(getApplicationContext(), title, message, fullImageUrl, pushId);
                          }
                      }

                      // 2. Если приложение свёрнуто, заблокировано или закрыто — также доставляем 20-сек и закреплённые уведомления в шторку!
                      if (!MainActivity.isActivityInForeground) {
                          JSONObject tempB = catalog.optJSONObject("tempBroadcast");
                          if (tempB != null && tempB.optBoolean("active", false)) {
                              String tmpId = tempB.optString("id", "");
                              String title = tempB.optString("title", "🔥 Объявление Dark Music");
                              String message = tempB.optString("message", "");
                              if (!tmpId.isEmpty() && !message.isEmpty() && !prefs.getBoolean("seen_" + tmpId, false)) {
                                  prefs.edit().putBoolean("seen_" + tmpId, true).apply();
                                  String fullImageUrl = resolveAssetUrl(repo, branch, "logo.png");
                                  MainActivity.postSystemPushToShade(getApplicationContext(), title, message, fullImageUrl, tmpId);
                              }
                          }

                          JSONObject pinB = catalog.optJSONObject("pinnedBroadcast");
                          if (pinB != null && pinB.optBoolean("active", false)) {
                              String pinId = pinB.optString("id", "");
                              if (pinId.isEmpty()) {
                                  long upd = pinB.optLong("updatedAt", 0L);
                                  if (upd > 0L) pinId = "pin_" + upd;
                              }
                              String title = pinB.optString("title", "⚡ Важная информация Dark Music");
                              String message = pinB.optString("message", "");
                              if (!pinId.isEmpty() && !message.isEmpty() && !prefs.getBoolean("seen_" + pinId, false)) {
                                  prefs.edit().putBoolean("seen_" + pinId, true).apply();
                                  String fullImageUrl = resolveAssetUrl(repo, branch, "logo.png");
                                  MainActivity.postSystemPushToShade(getApplicationContext(), title, message, fullImageUrl, pinId);
                              }
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private String resolveAssetUrl(String repo, String branch, String fileOrUrl) {
                  if (fileOrUrl == null || fileOrUrl.isEmpty()) {
                      return "https://raw.githubusercontent.com/" + repo + "/" + branch + "/logo.png";
                  }
                  if (fileOrUrl.startsWith("http://") || fileOrUrl.startsWith("https://")) {
                      return fileOrUrl;
                  }
                  String clean = fileOrUrl.replaceFirst("^/+", "");
                  return "https://raw.githubusercontent.com/" + repo + "/" + branch + "/" + clean;
              }

              private JSONObject fetchRemoteCatalogJson(String repo, String branch, String token) {
                  try {
                      String apiUrl = "https://api.github.com/repos/" + repo + "/contents/catalog.json?ref=" + branch + "&_cb=" + System.currentTimeMillis();
                      HttpURLConnection conn = (HttpURLConnection) new URL(apiUrl).openConnection();
                      conn.setConnectTimeout(6000);
                      conn.setReadTimeout(6000);
                      conn.setUseCaches(false);
                      conn.setRequestProperty("Accept", "application/vnd.github.v3+json");
                      conn.setRequestProperty("If-None-Match", "\"" + System.currentTimeMillis() + "\"");
                      if (token != null && !token.isEmpty()) {
                          conn.setRequestProperty("Authorization", "token " + token);
                      }
                      int code = conn.getResponseCode();
                      if (code == 200) {
                          BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = br.readLine()) != null) sb.append(line);
                          br.close();
                          JSONObject meta = new JSONObject(sb.toString());
                          String b64 = meta.optString("content", "").replaceAll("\\s+", "");
                          if (!b64.isEmpty()) {
                              byte[] decoded = Base64.decode(b64, Base64.DEFAULT);
                              return new JSONObject(new String(decoded, StandardCharsets.UTF_8));
                          }
                      }
                  } catch (Exception ignored) {}

                  try {
                      String rawUrl = "https://raw.githubusercontent.com/" + repo + "/" + branch + "/catalog.json?_cb=" + System.currentTimeMillis();
                      HttpURLConnection conn = (HttpURLConnection) new URL(rawUrl).openConnection();
                      conn.setConnectTimeout(6000);
                      conn.setReadTimeout(6000);
                      conn.setUseCaches(false);
                      if (conn.getResponseCode() == 200) {
                          BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = br.readLine()) != null) sb.append(line);
                          br.close();
                          return new JSONObject(sb.toString());
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  startBackgroundPushWatcherLoop();
                  if (intent != null && intent.getAction() != null) {
                      String act = intent.getAction();
                      if (ACTION_START_WATCHER.equals(act)) {
                          new Thread(this::pollCatalogAndDeliverBackgroundPushes).start();
                          return START_STICKY;
                      } else if (ACTION_PLAY.equals(act)) {
                          MainActivity.dispatchToWebView("play", -1);
                          return START_STICKY;
                      } else if (ACTION_PAUSE.equals(act)) {
                          MainActivity.dispatchToWebView("pause", -1);
                          return START_STICKY;
                      } else if (ACTION_NEXT.equals(act)) {
                          MainActivity.dispatchToWebView("next", -1);
                          return START_STICKY;
                      } else if (ACTION_PREV.equals(act)) {
                          MainActivity.dispatchToWebView("prev", -1);
                          return START_STICKY;
                      } else if (ACTION_UPDATE.equals(act)) {
                          currentTitle = intent.getStringExtra("title") != null ? intent.getStringExtra("title") : "Dark Music";
                          currentArtist = intent.getStringExtra("artist") != null ? intent.getStringExtra("artist") : "Dark Music";
                          currentAlbum = intent.getStringExtra("album") != null ? intent.getStringExtra("album") : "Dark Music";
                          String newCover = intent.getStringExtra("coverUrl") != null ? intent.getStringExtra("coverUrl") : "";
                          isPlaying = intent.getBooleanExtra("isPlaying", false);
                          durationMs = intent.getLongExtra("durationMs", 165000L);
                          positionMs = intent.getLongExtra("positionMs", 0L);

                          if (wakeLock != null) {
                              if (isPlaying && !wakeLock.isHeld()) {
                                  wakeLock.acquire(6 * 60 * 60 * 1000L);
                              } else if (!isPlaying && wakeLock.isHeld()) {
                                  wakeLock.release();
                              }
                          }

                          if (!newCover.equals(currentCoverUrl)) {
                              currentCoverUrl = newCover;
                              fetchCoverArtAsync(newCover);
                          }
                          updateSessionAndNotification();
                      }
                  }
                  return START_STICKY;
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  super.onTaskRemoved(rootIntent);
                  scheduleWatchdogAlarm();
                  try {
                      Intent restartIntent = new Intent(getApplicationContext(), MediaPlaybackService.class);
                      restartIntent.setAction(ACTION_START_WATCHER);
                      getApplicationContext().startService(restartIntent);
                  } catch (Exception ignored) {}
              }

              private void fetchCoverArtAsync(final String urlStr) {
                  if (urlStr == null || urlStr.isEmpty()) return;
                  new Thread(() -> {
                      try {
                          URL url = new URL(urlStr);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(6000);
                          conn.setReadTimeout(6000);
                          conn.setDoInput(true);
                          conn.connect();
                          InputStream is = conn.getInputStream();
                          Bitmap bmp = BitmapFactory.decodeStream(is);
                          is.close();
                          if (bmp != null && urlStr.equals(currentCoverUrl)) {
                              currentArtwork = bmp;
                              updateSessionAndNotification();
                          }
                      } catch (Exception ignored) {}
                  }).start();
              }

              private void updateSessionAndNotification() {
                  try {
                      long actions = PlaybackState.ACTION_PLAY
                              | PlaybackState.ACTION_PAUSE
                              | PlaybackState.ACTION_PLAY_PAUSE
                              | PlaybackState.ACTION_SKIP_TO_NEXT
                              | PlaybackState.ACTION_SKIP_TO_PREVIOUS
                              | PlaybackState.ACTION_SEEK_TO;

                      int state = isPlaying ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED;
                      PlaybackState playbackState = new PlaybackState.Builder()
                              .setActions(actions)
                              .setState(state, positionMs, isPlaying ? 1.0f : 0.0f)
                              .build();
                      mediaSession.setPlaybackState(playbackState);

                      MediaMetadata.Builder metaBuilder = new MediaMetadata.Builder()
                              .putString(MediaMetadata.METADATA_KEY_TITLE, currentTitle)
                              .putString(MediaMetadata.METADATA_KEY_ARTIST, currentArtist)
                              .putString(MediaMetadata.METADATA_KEY_ALBUM, currentAlbum)
                              .putLong(MediaMetadata.METADATA_KEY_DURATION, durationMs);

                      if (currentArtwork != null) {
                          metaBuilder.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, currentArtwork);
                          metaBuilder.putBitmap(MediaMetadata.METADATA_KEY_ART, currentArtwork);
                      }
                      mediaSession.setMetadata(metaBuilder.build());

                      Notification notification = buildMediaNotification();
                      if (isPlaying) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              startForeground(NOTIFICATION_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                          } else {
                              startForeground(NOTIFICATION_ID, notification);
                          }
                      } else {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) {
                              nm.notify(NOTIFICATION_ID, notification);
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private Notification buildMediaNotification() {
                  Intent openIntent = new Intent(this, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent contentPendingIntent = PendingIntent.getActivity(
                          this, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  PendingIntent prevPending = PendingIntent.getService(
                          this, 1, new Intent(this, MediaPlaybackService.class).setAction(ACTION_PREV),
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
                  PendingIntent playPausePending = PendingIntent.getService(
                          this, 2, new Intent(this, MediaPlaybackService.class).setAction(isPlaying ? ACTION_PAUSE : ACTION_PLAY),
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
                  PendingIntent nextPending = PendingIntent.getService(
                          this, 3, new Intent(this, MediaPlaybackService.class).setAction(ACTION_NEXT),
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Notification.Builder builder;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      builder = new Notification.Builder(this, CHANNEL_ID);
                  } else {
                      builder = new Notification.Builder(this);
                  }

                  Notification.Action prevAction = new Notification.Action.Builder(
                          android.R.drawable.ic_media_previous, "Предыдущий", prevPending).build();
                  Notification.Action playPauseAction = new Notification.Action.Builder(
                          isPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play,
                          isPlaying ? "Пауза" : "Играть", playPausePending).build();
                  Notification.Action nextAction = new Notification.Action.Builder(
                          android.R.drawable.ic_media_next, "Следующий", nextPending).build();

                  Notification.MediaStyle style = new Notification.MediaStyle()
                          .setMediaSession(mediaSession.getSessionToken())
                          .setShowActionsInCompactView(0, 1, 2);

                  builder.setStyle(style)
                          .setContentTitle(currentTitle)
                          .setContentText(currentArtist)
                          .setSubText(currentAlbum)
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentIntent(contentPendingIntent)
                          .setVisibility(Notification.VISIBILITY_PUBLIC)
                          .setOngoing(isPlaying)
                          .setOnlyAlertOnce(true)
                          .addAction(prevAction)
                          .addAction(playPauseAction)
                          .addAction(nextAction);

                  if (currentArtwork != null) {
                      builder.setLargeIcon(currentArtwork);
                  }

                  return builder.build();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "Dark Music Плеер",
                              NotificationManager.IMPORTANCE_LOW
                      );
                      channel.setDescription("Управление воспроизведением на экране блокировки");
                      channel.setShowBadge(false);
                      channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) {
                          nm.createNotificationChannel(channel);
                          NotificationChannel pushChannel = new NotificationChannel(
                                  "dark_music_push_channel",
                                  "Dark Music Уведомления",
                                  NotificationManager.IMPORTANCE_HIGH
                          );
                          pushChannel.setDescription("Системные push-уведомления от владельца Dark Music");
                          pushChannel.enableVibration(true);
                          pushChannel.setShowBadge(true);
                          pushChannel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                          nm.createNotificationChannel(pushChannel);
                      }
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onDestroy() {
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
                  if (mediaSession != null) {
                      mediaSession.release();
                  }
                  scheduleWatchdogAlarm();
                  super.onDestroy();
              }
          }
