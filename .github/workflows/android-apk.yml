name: Build Dark Music APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
      - "Глянцевая музыкальная нота в кольце.png"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Prepare local web app
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Generate launcher icon resources from the original PNG
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import os
          from PIL import Image, ImageOps
          source = "Глянцевая музыкальная нота в кольце.png"
          im = Image.open(source).convert("RGBA")
          # Preserve the supplied artwork; fit it to a square canvas without redrawing it.
          side = max(im.width, im.height)
          canvas = Image.new("RGBA", (side, side), (0, 0, 0, 255))
          canvas.alpha_composite(im, ((side-im.width)//2, (side-im.height)//2))
          for name, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              folder=f"android/app/src/main/res/mipmap-{name}"
              os.makedirs(folder, exist_ok=True)
              canvas.resize((size,size), Image.Resampling.LANCZOS).save(os.path.join(folder,"ic_launcher.png"))
          PY

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dark-music-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
