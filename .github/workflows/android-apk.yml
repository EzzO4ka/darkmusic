name: Build Dark Music APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find /usr/local/lib/android -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Native Android Project with MediaSession & LockScreen Service
        run: |
          mkdir -p android-project/app/src/main/java/com/darkmusic/app
          mkdir -p android-project/app/src/main/res/drawable
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/assets

          # Копируем index.html и локальные ресурсы в assets APK
          cp index.html android-project/app/src/main/assets/index.html
          [ -f catalog.json ] && cp catalog.json android-project/app/src/main/assets/catalog.json || true
          [ -f logo.png ] && cp logo.png android-project/app/src/main/assets/logo.png || true
          [ -f logo.png ] && cp logo.png android-project/app/src/main/res/drawable/app_logo.png || true
          [ -f avatars/logo.png ] && cp avatars/logo.png android-project/app/src/main/res/drawable/app_logo.png || true

          cat << 'EOF' > android-project/settings.gradle
          rootProject.name = "DarkMusic"
          include ':app'
          EOF

          cat << 'EOF' > android-project/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > android-project/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat << 'EOF' > android-project/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "com.darkmusic.app"
              compileSdk 34

              defaultConfig {
                  applicationId "com.darkmusic.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 20
                  versionName "2.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.darkmusic.app">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="Dark Music"
                  android:icon="@android:drawable/ic_lock_silent_mode_off"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MediaPlaybackService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          if [ -f android-project/app/src/main/res/drawable/app_logo.png ]; then
              sed -i 's|@android:drawable/ic_lock_silent_mode_off|@drawable/app_logo|g' android-project/app/src/main/AndroidManifest.xml
          fi

          cat << 'EOF' > android-project/app/src/main/java/com/darkmusic/app/MediaPlaybackService.java
          package com.darkmusic.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MediaPlaybackService extends Service {
              public static final String CHANNEL_ID = "dark_music_playback_channel";
              public static final int NOTIFICATION_ID = 4681;

              public static final String ACTION_UPDATE = "com.darkmusic.app.ACTION_UPDATE";
              public static final String ACTION_PLAY = "com.darkmusic.app.ACTION_PLAY";
              public static final String ACTION_PAUSE = "com.darkmusic.app.ACTION_PAUSE";
              public static final String ACTION_NEXT = "com.darkmusic.app.ACTION_NEXT";
              public static final String ACTION_PREV = "com.darkmusic.app.ACTION_PREV";

              private MediaSession mediaSession;
              private PowerManager.WakeLock wakeLock;

              private String currentTitle = "Dark Music";
              private String currentArtist = "Эксклюзивный каталог";
              private String currentAlbum = "Dark Music";
              private String currentCoverUrl = "";
              private Bitmap currentArtwork = null;
              private boolean isPlaying = false;
              private long durationMs = 165000L;
              private long positionMs = 0L;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();

                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "DarkMusic::AudioWakeLock");
                      wakeLock.setReferenceCounted(false);
                  }

                  mediaSession = new MediaSession(this, "DarkMusicMediaSession");
                  mediaSession.setFlags(MediaSession.FLAG_HANDLES_MEDIA_BUTTONS | MediaSession.FLAG_HANDLES_TRANSPORT_CONTROLS);
                  mediaSession.setCallback(new MediaSession.Callback() {
                      @Override
                      public void onPlay() {
                          MainActivity.dispatchToWebView("play", -1);
                      }

                      @Override
                      public void onPause() {
                          MainActivity.dispatchToWebView("pause", -1);
                      }

                      @Override
                      public void onSkipToNext() {
                          MainActivity.dispatchToWebView("next", -1);
                      }

                      @Override
                      public void onSkipToPrevious() {
                          MainActivity.dispatchToWebView("prev", -1);
                      }

                      @Override
                      public void onSeekTo(long pos) {
                          positionMs = pos;
                          updateSessionAndNotification();
                          MainActivity.dispatchToWebView("seekto", pos);
                      }
                  });
                  mediaSession.setActive(true);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && intent.getAction() != null) {
                      String act = intent.getAction();
                      if (ACTION_PLAY.equals(act)) {
                          MainActivity.dispatchToWebView("play", -1);
                          return START_STICKY;
                      } else if (ACTION_PAUSE.equals(act)) {
                          MainActivity.dispatchToWebView("pause", -1);
                          return START_STICKY;
                      } else if (ACTION_NEXT.equals(act)) {
                          MainActivity.dispatchToWebView("next", -1);
                          return START_STICKY;
                      } else if (ACTION_PREV.equals(act)) {
                          MainActivity.dispatchToWebView("prev", -1);
                          return START_STICKY;
                      } else if (ACTION_UPDATE.equals(act)) {
                          currentTitle = intent.getStringExtra("title") != null ? intent.getStringExtra("title") : "Dark Music";
                          currentArtist = intent.getStringExtra("artist") != null ? intent.getStringExtra("artist") : "Dark Music";
                          currentAlbum = intent.getStringExtra("album") != null ? intent.getStringExtra("album") : "Dark Music";
                          String newCover = intent.getStringExtra("coverUrl") != null ? intent.getStringExtra("coverUrl") : "";
                          isPlaying = intent.getBooleanExtra("isPlaying", false);
                          durationMs = intent.getLongExtra("durationMs", 165000L);
                          positionMs = intent.getLongExtra("positionMs", 0L);

                          if (wakeLock != null) {
                              if (isPlaying && !wakeLock.isHeld()) {
                                  wakeLock.acquire(6 * 60 * 60 * 1000L);
                              } else if (!isPlaying && wakeLock.isHeld()) {
                                  wakeLock.release();
                              }
                          }

                          if (!newCover.equals(currentCoverUrl)) {
                              currentCoverUrl = newCover;
                              fetchCoverArtAsync(newCover);
                          }
                          updateSessionAndNotification();
                      }
                  }
                  return START_STICKY;
              }

              private void fetchCoverArtAsync(final String urlStr) {
                  if (urlStr == null || urlStr.isEmpty()) return;
                  new Thread(() -> {
                      try {
                          URL url = new URL(urlStr);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(6000);
                          conn.setReadTimeout(6000);
                          conn.setDoInput(true);
                          conn.connect();
                          InputStream is = conn.getInputStream();
                          Bitmap bmp = BitmapFactory.decodeStream(is);
                          is.close();
                          if (bmp != null && urlStr.equals(currentCoverUrl)) {
                              currentArtwork = bmp;
                              updateSessionAndNotification();
                          }
                      } catch (Exception ignored) {}
                  }).start();
              }

              private void updateSessionAndNotification() {
                  try {
                      long actions = PlaybackState.ACTION_PLAY
                              | PlaybackState.ACTION_PAUSE
                              | PlaybackState.ACTION_PLAY_PAUSE
                              | PlaybackState.ACTION_SKIP_TO_NEXT
                              | PlaybackState.ACTION_SKIP_TO_PREVIOUS
                              | PlaybackState.ACTION_SEEK_TO;

                      int state = isPlaying ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED;
                      PlaybackState playbackState = new PlaybackState.Builder()
                              .setActions(actions)
                              .setState(state, positionMs, isPlaying ? 1.0f : 0.0f)
                              .build();
                      mediaSession.setPlaybackState(playbackState);

                      MediaMetadata.Builder metaBuilder = new MediaMetadata.Builder()
                              .putString(MediaMetadata.METADATA_KEY_TITLE, currentTitle)
                              .putString(MediaMetadata.METADATA_KEY_ARTIST, currentArtist)
                              .putString(MediaMetadata.METADATA_KEY_ALBUM, currentAlbum)
                              .putLong(MediaMetadata.METADATA_KEY_DURATION, durationMs);

                      if (currentArtwork != null) {
                          metaBuilder.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, currentArtwork);
                          metaBuilder.putBitmap(MediaMetadata.METADATA_KEY_ART, currentArtwork);
                      }
                      mediaSession.setMetadata(metaBuilder.build());

                      Notification notification = buildMediaNotification();
                      if (isPlaying) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              startForeground(NOTIFICATION_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                          } else {
                              startForeground(NOTIFICATION_ID, notification);
                          }
                      } else {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) {
                              nm.notify(NOTIFICATION_ID, notification);
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private Notification buildMediaNotification() {
                  Intent openIntent = new Intent(this, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent contentPendingIntent = PendingIntent.getActivity(
                          this, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  PendingIntent prevPending = PendingIntent.getService(
                          this, 1, new Intent(this, MediaPlaybackService.class).setAction(ACTION_PREV),
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
                  PendingIntent playPausePending = PendingIntent.getService(
                          this, 2, new Intent(this, MediaPlaybackService.class).setAction(isPlaying ? ACTION_PAUSE : ACTION_PLAY),
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
                  PendingIntent nextPending = PendingIntent.getService(
                          this, 3, new Intent(this, MediaPlaybackService.class).setAction(ACTION_NEXT),
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Notification.Builder builder;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      builder = new Notification.Builder(this, CHANNEL_ID);
                  } else {
                      builder = new Notification.Builder(this);
                  }

                  Notification.Action prevAction = new Notification.Action.Builder(
                          android.R.drawable.ic_media_previous, "Предыдущий", prevPending).build();
                  Notification.Action playPauseAction = new Notification.Action.Builder(
                          isPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play,
                          isPlaying ? "Пауза" : "Играть", playPausePending).build();
                  Notification.Action nextAction = new Notification.Action.Builder(
                          android.R.drawable.ic_media_next, "Следующий", nextPending).build();

                  Notification.MediaStyle style = new Notification.MediaStyle()
                          .setMediaSession(mediaSession.getSessionToken())
                          .setShowActionsInCompactView(0, 1, 2);

                  builder.setStyle(style)
                          .setContentTitle(currentTitle)
                          .setContentText(currentArtist)
                          .setSubText(currentAlbum)
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentIntent(contentPendingIntent)
                          .setVisibility(Notification.VISIBILITY_PUBLIC)
                          .setOngoing(isPlaying)
                          .setOnlyAlertOnce(true)
                          .addAction(prevAction)
                          .addAction(playPauseAction)
                          .addAction(nextAction);

                  if (currentArtwork != null) {
                      builder.setLargeIcon(currentArtwork);
                  }

                  return builder.build();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "Dark Music Плеер",
                              NotificationManager.IMPORTANCE_LOW
                      );
                      channel.setDescription("Управление воспроизведением на экране блокировки");
                      channel.setShowBadge(false);
                      channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) {
                          nm.createNotificationChannel(channel);
                          NotificationChannel pushChannel = new NotificationChannel(
                                  "dark_music_push_channel",
                                  "Dark Music Уведомления",
                                  NotificationManager.IMPORTANCE_HIGH
                          );
                          pushChannel.setDescription("Системные push-уведомления от владельца Dark Music");
                          pushChannel.enableVibration(true);
                          pushChannel.setShowBadge(true);
                          pushChannel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                          nm.createNotificationChannel(pushChannel);
                      }
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onDestroy() {
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
                  if (mediaSession != null) {
                      mediaSession.release();
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/darkmusic/app/MainActivity.java
          package com.darkmusic.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private static WebView staticWebView;
              public static final String PUSH_CHANNEL_ID = "dark_music_push_channel";

              public static class BackgroundAudioWebView extends WebView {
                  public BackgroundAudioWebView(Context context) {
                      super(context);
                  }

                  @Override
                  protected void onWindowVisibilityChanged(int visibility) {
                      super.onWindowVisibilityChanged(View.VISIBLE);
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) {
                          NotificationChannel pushChannel = new NotificationChannel(
                                  PUSH_CHANNEL_ID,
                                  "Dark Music Уведомления",
                                  NotificationManager.IMPORTANCE_HIGH
                          );
                          pushChannel.setDescription("Системные push-уведомления от владельца Dark Music");
                          pushChannel.enableVibration(true);
                          pushChannel.setShowBadge(true);
                          pushChannel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                          nm.createNotificationChannel(pushChannel);
                      }
                  }

                  if (Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }

                  BackgroundAudioWebView webView = new BackgroundAudioWebView(this);
                  staticWebView = webView;
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.addJavascriptInterface(new AndroidMediaBridge(this), "AndroidMediaBridge");
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("file://") || url.contains("raw.githubusercontent.com") || url.contains("api.github.com")) {
                              return false;
                          }
                          try {
                              Intent ext = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(ext);
                              return true;
                          } catch (Exception e) {
                              return false;
                          }
                      }
                  });

                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                          try {
                              if (url.startsWith("http")) {
                                  Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(i);
                              }
                          } catch (Exception ignored) {}
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public static void dispatchToWebView(final String action, final long seekMs) {
                  if (staticWebView == null) return;
                  staticWebView.post(() -> {
                      String js = "if(window.__darkMusicNativeAction){window.__darkMusicNativeAction('" + action + "'," + seekMs + ");}";
                      staticWebView.evaluateJavascript(js, null);
                  });
              }

              public static class AndroidMediaBridge {
                  private final Context context;

                  public AndroidMediaBridge(Context ctx) {
                      this.context = ctx.getApplicationContext();
                  }

                  @JavascriptInterface
                  public void updateMediaState(String title, String artist, String album, String coverUrl, boolean isPlaying, long durationMs, long positionMs) {
                      Intent serviceIntent = new Intent(context, MediaPlaybackService.class);
                      serviceIntent.setAction(MediaPlaybackService.ACTION_UPDATE);
                      serviceIntent.putExtra("title", title);
                      serviceIntent.putExtra("artist", artist);
                      serviceIntent.putExtra("album", album);
                      serviceIntent.putExtra("coverUrl", coverUrl);
                      serviceIntent.putExtra("isPlaying", isPlaying);
                      serviceIntent.putExtra("durationMs", durationMs);
                      serviceIntent.putExtra("positionMs", positionMs);

                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && isPlaying) {
                              context.startForegroundService(serviceIntent);
                          } else {
                              context.startService(serviceIntent);
                          }
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void showSystemPushNotification(final String title, final String message, final String imageUrl, final String pushId) {
                      new Thread(() -> {
                          try {
                              NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                              if (nm == null) return;

                              Intent openIntent = new Intent(context, MainActivity.class);
                              openIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                              PendingIntent contentPendingIntent = PendingIntent.getActivity(
                                      context, 9001, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );

                              Notification.Builder builder;
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  builder = new Notification.Builder(context, PUSH_CHANNEL_ID);
                              } else {
                                  builder = new Notification.Builder(context)
                                          .setPriority(Notification.PRIORITY_HIGH)
                                          .setDefaults(Notification.DEFAULT_ALL);
                              }

                              builder.setContentTitle(title != null && !title.isEmpty() ? title : "Dark Music")
                                      .setContentText(message != null ? message : "")
                                      .setStyle(new Notification.BigTextStyle().bigText(message != null ? message : ""))
                                      .setSmallIcon(android.R.drawable.ic_popup_reminder)
                                      .setContentIntent(contentPendingIntent)
                                      .setAutoCancel(true)
                                      .setVisibility(Notification.VISIBILITY_PUBLIC);

                              if (imageUrl != null && !imageUrl.isEmpty() && imageUrl.startsWith("http")) {
                                  try {
                                      URL url = new URL(imageUrl);
                                      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                                      conn.setConnectTimeout(5000);
                                      conn.setReadTimeout(5000);
                                      conn.setDoInput(true);
                                      conn.connect();
                                      InputStream is = conn.getInputStream();
                                      Bitmap bmp = BitmapFactory.decodeStream(is);
                                      is.close();
                                      if (bmp != null) {
                                          builder.setLargeIcon(bmp);
                                      }
                                  } catch (Exception ignored) {}
                              }

                              int notifId = (pushId != null && !pushId.isEmpty()) ? Math.abs(pushId.hashCode()) : (int) (System.currentTimeMillis() & 0xfffffff);
                              if (notifId == MediaPlaybackService.NOTIFICATION_ID) {
                                  notifId += 100;
                              }
                              nm.notify(notifId, builder.build());
                          } catch (Exception ignored) {}
                      }).start();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (staticWebView != null && staticWebView.canGoBack()) {
                      staticWebView.goBack();
                  } else {
                      moveTaskToBack(true);
                  }
              }
          }
          EOF

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK with Gradle
        working-directory: android-project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload Dark Music APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkMusic-v2.0-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
